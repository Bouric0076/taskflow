name: taskflow
description: A minimalist task manager with alarms and focus mode.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^4.0.2
  
  # Database
  drift: ^2.30.1
  drift_flutter: ^0.2.8
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.3
  path: ^1.9.0
  
  # Notifications & Alarm
  flutter_local_notifications: ^21.0.0
  alarm: ^5.2.1
  timezone: ^0.11.0
  flutter_timezone: ^5.0.2
  
  # Sharing
  share_plus: ^13.0.0
  
  # Preferences
  shared_preferences: ^2.2.2
  
  # Animations
  flutter_animate: ^4.5.0
  
  # UI
  google_fonts: ^8.0.2
  gap: ^3.0.1
  flutter_slidable: ^4.0.3
  table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.1
  build_runner: ^2.13.1
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true