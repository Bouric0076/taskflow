name: Release Android App

"on":
  push:
    tags:
      - "v*"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (example: v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Release tag is empty"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p release-assets
          TAG="${{ steps.release_tag.outputs.tag }}"

          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "release-assets/taskflow-${TAG}-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "release-assets/taskflow-${TAG}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk "release-assets/taskflow-${TAG}-x86_64.apk"
          cp build/app/outputs/bundle/release/app-release.aab "release-assets/taskflow-${TAG}.aab"

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
